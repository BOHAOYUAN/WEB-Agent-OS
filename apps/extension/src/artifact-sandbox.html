<!doctype html>
<html lang="en">
  <head>
    <meta charset="utf-8" />
    <title>Artifact Sandbox</title>
    <style>
      html, body { margin: 0; height: 100%; background: #0b1220; }
      iframe { display: block; width: 100%; height: 100%; border: 0; }
    </style>
  </head>
  <body>
    <iframe id="target" sandbox="allow-scripts" title="Artifact"></iframe>
    <script>
      // This page is declared under manifest.sandbox: unique origin, no chrome.*
      // APIs, relaxed sandbox CSP. It hosts the untrusted document in a nested
      // sandboxed iframe so the artifact parses as a real document (not as
      // nested text inside document.write).
      (function () {
        var target = document.getElementById("target");
        window.addEventListener("message", function (event) {
          var data = event.data;
          if (!data || typeof data.type !== "string") return;

          // From the sidepanel: render instruction.
          if (event.source === window.parent) {
            if (data.type !== "webos/artifact.render" || typeof data.html !== "string") return;
            target.srcdoc = data.html;
            return;
          }

          // From the artifact iframe: interaction feedback via webos.report().
          // The iframe has an opaque origin, so `event.origin` is "null" and
          // cannot be checked — `event.source` is the only trustworthy signal.
          // Verify it is OUR iframe, then relay upward (this page has no
          // chrome.* API, so the sidepanel does the runtime hop).
          if (event.source === target.contentWindow && data.type === "webos.artifact.feedback") {
            window.parent.postMessage(
              { type: "webos.artifact.feedback", payload: data.payload },
              "*",
            );
          }
        });
      })();
    </script>
  </body>
</html>
